# por-attest miner config for Telegraph v2 (Anjoman).
# Validate at POST https://integrate.telegraphprotocol.com/api/validate before registering.
# The schema is closed: do not add keys that are not in the v2 docs.

version: "1"
kind: miner
id: 27741
slug: por-attest
protocol: generic
name: por-attest
description: >
  Proof-of-reserve checks for stablecoins and tokenized assets. Compares the latest
  attested reserves (Chainlink Proof of Reserve or the issuer's attestation report)
  with circulating supply read on-chain, and returns the ratio, report age, the source
  of every figure, and a verdict.
base_url: https://por-attest.alnicewilliams3.workers.dev

auth:
  type: none

rate_limit_per_sec: 10
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

errors:
  message_path: error.message
  code_path: error.code

endpoints:
  - path: /reserve
    external_path: /reserve
    method: GET
    description: >
      Answers whether an asset's attested reserves back its circulating supply.
      Returns reserves, supply, collateral ratio, report date and age, the source of each
      figure (Chainlink feed round or issuer report), block numbers for on-chain reads,
      and a verdict: fully_backed, under_backed or unverified.
    intents: [ASSET_RESERVE_ATTESTATION_GENERAL]
    params:
      query:
        required: []
        optional:
          - name: question
            type: string
            intents: ["*"]
            description: "Natural-language question, e.g. 'Is USDC fully backed right now?'"
          - name: asset
            type: string
            intents: ["*"]
            description: "Asset symbol or contract name, case-insensitive, e.g. USDC, USDT, WBTC, PAXG, USDe, cbBTC. See /assets for the list."
          - name: chain
            type: string
            intents: ["*"]
            description: "Chain whose Proof of Reserve feed to prefer when an asset has several: ethereum, base, arbitrum, optimism, polygon, bsc, avalanche, ink or plasma."
          - name: round_id
            type: string
            intents: ["*"]
            description: "Audit use: a past Chainlink round id, in decimal, for an exact historical figure. Omit for the latest answer."
          - name: report_date
            type: string
            intents: ["*"]
            description: "Audit use: an issuer report date as YYYY-MM-DD, for that report's exact figures. Omit for the latest answer."

  - path: /supply
    external_path: /supply
    method: GET
    description: >
      Verifies a token's circulating and total supply on-chain across the chains it lives on.
      Returns supply per chain and in total, each with chain, block number and timestamp,
      excluding bridged duplicates and known issuer treasury wallets.
    intents: [TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: asset
            type: string
            intents: ["*"]
            description: "Asset symbol, case-insensitive, e.g. USDC. See /assets for the list."
        optional:
          - name: chain
            type: string
            intents: ["*"]
            description: "Optional single chain to read, e.g. ethereum, base, arbitrum. Omit for all chains."

  - path: /assets
    external_path: /assets
    method: GET
    description: Lists every supported asset, its source and the chains read. Not intent-routed.

  - path: /health
    external_path: /health
    method: GET
    description: Health check. Not intent-routed.

intent_mapping:
  ASSET_RESERVE_ATTESTATION_GENERAL:
    endpoint: /reserve
    input:
      asset: { from: asset }
    output:
      attested_reserve: { path: headline.reserves, unit: whole units of the underlying asset }
      asset: { path: asset }
      block: { path: headline.block }
      source: { path: headline.source }

semantics:
  signal_mapping:
    label_field: verdict
    confidence_field: confidence
    reason_field: reason
  supported_intents:
    - ASSET_RESERVE_ATTESTATION_GENERAL
    - TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL

limitations:
  - code: STALE_REPORT
    message: "Issuer attestations are monthly; reports older than the asset's stale window return 'unverified'."
  - code: FIXED_ASSET_LIST
    message: "Only assets listed at /assets are supported."

docs:
  website: https://por-attest.alnicewilliams3.workers.dev
  documentation: https://por-attest.alnicewilliams3.workers.dev/assets
